<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty of Medicine - Alexandria University | 4th Year Final Results</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700;900&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --gold: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(59, 130, 246, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
    }

    .main-content {
      flex: 1;
    }

    .header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    .header::after {
      content: '';
      display: block;
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin: 16px auto 0;
      border-radius: 2px;
    }

    .logo {
      font-size: 15px;
      letter-spacing: 3px;
      color: var(--accent2);
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 15px;
    }

    .search-container {
      max-width: 480px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: #334155;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .target-box {
      background: rgba(245, 158, 11, 0.05);
      border: 1px dashed rgba(245, 158, 11, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .target-box input {
      margin-bottom: 0;
      font-size: 18px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .target-box label {
      color: var(--gold);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .results-container {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 20px 40px;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .student-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .student-card-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .student-name {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      text-align: right;
      direction: rtl;
    }

    .student-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      direction: ltr;
      text-align: left;
      gap: 8px;
    }

    @media (max-width: 680px) {
      .student-card-content {
        flex-direction: column-reverse;
        align-items: stretch;
      }
      .student-name {
        margin-bottom: 14px;
      }
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      direction: ltr;
      text-align: left;
    }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .badge b {
      color: var(--accent2);
    }

    .badge.appreciation-badge {
      color: #fff;
      font-weight: 700;
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.1);
    }

    .rank-banners-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .rank-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 14px;
      color: var(--gold);
      font-weight: 700;
    }

    .rank-banner.sub-rank {
      background: rgba(6, 182, 212, 0.08);
      border-color: rgba(6, 182, 212, 0.25);
      color: var(--accent2);
    }

    .rank-num {
      font-size: 24px;
      font-weight: 900;
    }

    .rank-change-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      margin-left: 4px;
    }

    .rank-change-badge.up {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .rank-change-badge.down {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .rank-change-badge.same {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .summary-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .summary-val {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
    }

    .summary-val.highlight {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--accent2);
      text-transform: uppercase;
      font-weight: 700;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .module-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      position: relative;
    }

    .module-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .score-big {
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .score-of {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .total-section {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(6, 182, 212, 0.05));
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .total-score {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .target-result-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(220, 38, 38, 0.05));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .target-result-card::before {
      content: '🎯 AM I FAR?';
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 12px;
      font-weight: 900;
      color: rgba(245, 158, 11, 0.5);
    }

    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 15px;
    }

    .diff-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .diff-value {
      font-size: 28px;
      font-weight: 900;
      color: #ef4444;
      margin: 5px 0;
    }

    .target-value {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold);
    }

    .error-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #f87171;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
    }

    .pass {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .fail {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .footer-signature {
      text-align: center;
      padding: 30px 20px;
      margin-top: auto;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(10, 15, 30, 0.5);
    }

    .footer-signature a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .footer-signature a:hover {
      color: #fff;
    }

    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      height: 320px;
    }

    @media (max-width: 600px) {
      .diff-grid {
        grid-template-columns: 1fr;
      }
      .total-section {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="main-content">
    <div class="header">
      <div class="logo">Alexandria Faculty of Medicine</div>
      <h1>4th Year Final Results</h1>
      <p class="subtitle">Official Cumulative & 4th Year Standing · Round 1 (2025-2026)</p>
    </div>

    <div class="search-container">
      <div class="search-box" style="border-color: rgba(6,182,212,0.3);">
        <label style="color:var(--accent2); font-weight: 600;">Student Number (ID)</label>
        <input type="number" id="studentId" placeholder="e.g. 1452 or 2307" autofocus>
        <div class="target-box">
          <label>🎯 Am I Far? (Optional)</label>
          <p style="font-size: 12px; color: var(--muted); margin-bottom: 10px;">
            Enter your target cumulative rank to see the exact points needed
          </p>
          <input type="number" id="targetRank" placeholder="Target Rank (e.g. 1 or 50)">
        </div>
        <button class="btn" onclick="searchStudent()">🔍 View Full Results</button>
      </div>
    </div>

    <div id="output"></div>
  </div>

  <div class="footer-signature">
    made by : <a href="https://t.me/behonor" target="_blank"><span>Mahmoud</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="4th_final.js"></script>

  <script>
    let allStudents = [];
    let validCumulativeStudents = [];
    let validY4Students = [];
    const MAX_4TH = 1655;

    function isNumeric(v) {
      return v !== null && v !== undefined && v !== '' && !isNaN(parseFloat(v)) && v !== 'غ' && v !== 'غ ب' && v !== 'راسب' && v !== '—';
    }

    function num(v) {
      return isNumeric(v) ? parseFloat(v) : 0;
    }

    function formatScore(v) {
      if (v === null || v === undefined || v === '' || v === '—') return '—';
      if (v === 'غ' || v === 'غ ب' || v === 'غائب') return 'Absent';
      if (v === 'راسب') return 'Fail';
      if (!isNumeric(v)) return translateGrade(v);
      const n = parseFloat(v);
      return Number.isInteger(n) ? n.toString() : parseFloat(n.toFixed(2)).toString();
    }

    function translateGrade(g) {
      if (!g) return '';
      const s = g.trim();
      if (s === 'ممتاز') return 'Excellent';
      if (s === 'جيد جدا') return 'Very Good';
      if (s === 'جيد') return 'Good';
      if (s === 'مقبول') return 'Pass';
      if (s === 'ضعيف') return 'Weak';
      if (s === 'راسب') return 'Fail';
      if (s === 'غ' || s === 'غ ب' || s === 'غائب') return 'Absent';
      if (s === 'دور ثان' || s === 'دور ثاني') return 'Second Round';
      if (s === 'ناجح') return 'Pass';
      return s;
    }

    function calcModuleRanks(list) {
      const modules = [
        { key: 'batenaScore', rankKey: 'batenaRank' },
        { key: 'gerahaScore', rankKey: 'gerahaRank' },
        { key: 'tekamlyScore', rankKey: 'tekamlyRank' },
        { key: 'dermaTotal', rankKey: 'dermaRank' },
        { key: 'cardioTotal', rankKey: 'cardioRank' },
        { key: 'neuroTotal', rankKey: 'neuroRank' },
        { key: 'investigativeTotal', rankKey: 'investigativeRank' }
      ];

      modules.forEach(mod => {
        let validMod = list.filter(s => isNumeric(s[mod.key]));
        validMod.sort((a, b) => num(b[mod.key]) - num(a[mod.key]));
        let rank = 1;
        for (let i = 0; i < validMod.length; i++) {
          if (i > 0 && num(validMod[i][mod.key]) < num(validMod[i - 1][mod.key])) {
            rank = i + 1;
          }
          validMod[i][mod.rankKey] = rank;
        }
      });
    }

    function initData() {
      const srcData = typeof studentsDataFinal !== 'undefined' ? studentsDataFinal : (typeof studentsData4th !== 'undefined' ? studentsData4th : null);
      if (!srcData) {
        document.getElementById('output').innerHTML = `
          <div class="results-container">
            <div class="error-box">⚠️ Please ensure 4th_final.js is in the same directory.</div>
          </div>`;
        return;
      }

      allStudents = srcData;

      // Valid Cumulative Students
      validCumulativeStudents = allStudents.filter(s => s.cumulativeTotal !== null && isNumeric(s.cumulativeTotal));
      validCumulativeStudents.sort((a, b) => num(b.cumulativeTotal) - num(a.cumulativeTotal));

      // Valid 4th Year Students
      validY4Students = allStudents.filter(s => isNumeric(s.totalGrade));
      validY4Students.sort((a, b) => num(b.totalGrade) - num(a.totalGrade));

      calcModuleRanks(validY4Students);
    }

    window.onload = () => {
      initData();
    };

    function barColor(pct) {
      if (pct >= 0.85) return '#10b981';
      if (pct >= 0.65) return '#3b82f6';
      if (pct >= 0.50) return '#f59e0b';
      return '#ef4444';
    }

    function moduleCard(name, score, max, gradeText, rank) {
      const hasScore = isNumeric(score);
      const isAbsent = score === 'غ' || score === 'غ ب';
      const p = hasScore ? num(score) / max : 0;
      const formatted = formatScore(score);
      const engGrade = translateGrade(gradeText);
      const pctDisplay = hasScore ? (p * 100).toFixed(1) + '%' : (isAbsent ? 'Absent' : (formatted || '—'));
      const rankHtml = rank ? `<div style="position:absolute;top:15px;right:15px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700" title="4th Year Rank in this module">🏆 #${rank}</div>` : '';
      const gradeBadge = engGrade && engGrade !== '*' ? `<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);color:var(--accent2);font-weight:600">${engGrade}</span>` : '';

      return `<div class="module-card">
        ${rankHtml}
        <div class="module-name" style="${rank ? 'padding-right: 65px;' : ''}">
          <span>${name}</span>
          ${gradeBadge}
        </div>
        <div class="score-row">
          <span class="score-big" style="color:${hasScore ? barColor(p) : '#ef4444'}">${formatted}</span>
          <span class="score-of">/ ${max}</span>
        </div>
        <div style="margin-top:8px;height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${(p * 100).toFixed(1)}%;background:${barColor(p)};border-radius:3px;transition:width 0.5s"></div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between">
          <span style="font-weight:600">${pctDisplay}</span>
          ${engGrade ? `<span style="color:var(--accent2);font-weight:600">${engGrade}</span>` : ''}
        </div>
      </div>`;
    }

    function subScoreRow(label, val, max) {
      const hasVal = isNumeric(val);
      const isAbsent = val === 'غ' || val === 'غ ب';
      const p = hasVal ? num(val) / max : 0;
      const formatted = formatScore(val);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03)">
        <span style="color:var(--muted)">${label}</span>
        <span style="font-weight:700;color:${hasVal ? barColor(p) : '#ef4444'}">${formatted} <span style="color:var(--muted);font-weight:400">/ ${max}</span></span>
      </div>`;
    }

    function searchStudent() {
      if (allStudents.length === 0) {
        initData();
        if (allStudents.length === 0) return;
      }

      const idInput = parseInt(document.getElementById('studentId').value);
      const targetInput = parseInt(document.getElementById('targetRank').value);
      const output = document.getElementById('output');

      if (!idInput) {
        output.innerHTML = '<div class="results-container"><div class="error-box">⚠️ Please enter a student seating number (ID)</div></div>';
        return;
      }

      const student = allStudents.find(s => s.id === idInput);
      if (!student) {
        output.innerHTML = '<div class="results-container"><div class="error-box">❌ Student ID not found in records!</div></div>';
        return;
      }

      renderResult(student, targetInput, output);
    }

    function renderResult(student, targetInput, outputEl) {
      const hasY4Total = isNumeric(student.totalGrade);
      const hasCumulative = student.cumulativeTotal !== null && isNumeric(student.cumulativeTotal);
      const isAbsent = student.totalGrade === 'غ' || student.totalGrade === 'غ ب';
      const engAppreciation = translateGrade(student.appreciation);
      const isFail = student.totalGrade === 'راسب' || engAppreciation.includes('Fail');
      const y4Val = hasY4Total ? num(student.totalGrade) : 0;
      const pctPct = hasY4Total ? ((y4Val / MAX_4TH) * 100).toFixed(2) : '—';
      const passStatus = isFail ? 'Fail' : (isAbsent ? 'Absent' : (hasY4Total ? (engAppreciation || 'Pass') : '—'));

      // Target "Am I Far?" (Comparison on Cumulative Rank if available, else 4th year rank)
      let targetHTML = '';
      if (targetInput && hasCumulative && student.cumulativeRank) {
        let ts = validCumulativeStudents.find(s => s.cumulativeRank === targetInput);
        if (!ts) ts = validCumulativeStudents.find(s => s.cumulativeRank >= targetInput);
        if (student.cumulativeRank <= targetInput) {
          targetHTML = `<div class="target-result-card" style="border-color:#10b981; background: rgba(16, 185, 129, 0.05);">
            <h3 style="color:#10b981; text-align:center; font-weight: 700;">🎉 You have already achieved or surpassed this cumulative rank!</h3>
          </div>`;
        } else if (ts) {
          const tTotal = num(ts.cumulativeTotal);
          const diffScore = (tTotal - num(student.cumulativeTotal)).toFixed(2);
          targetHTML = `
            <div class="target-result-card">
              <div style="text-align:center;margin-bottom:10px">
                <span style="color:var(--muted);font-size:14px;font-weight:600">Comparison with Cumulative Rank #${ts.cumulativeRank}</span>
              </div>
              <div class="diff-grid">
                <div class="diff-item">
                  <div style="font-size:13px;color:var(--muted)">Target Cumulative Total</div>
                  <div class="target-value">${formatScore(tTotal)}</div>
                  <div style="font-size:12px;color:var(--muted)">Rank #${ts.cumulativeRank} score</div>
                </div>
                <div class="diff-item">
                  <div style="font-size:13px;color:var(--muted)">Cumulative Gap</div>
                  <div class="diff-value">🔻 ${diffScore} <span style="font-size:15px">Marks</span></div>
                  <div style="font-size:12px;color:var(--muted)">Required to reach Rank #${ts.cumulativeRank}</div>
                </div>
              </div>
            </div>`;
        }
      }

      // Performance analytics
      let analyticsHTML = '';
      let bestSubName = '—';
      let exportPct = '—';

      if (hasY4Total) {
        const totalValid = validY4Students.length;
        const currentRank = student.cumulativeRank || student.year4Rank || 1;
        const percentile = ((totalValid - currentRank) / totalValid * 100).toFixed(1);
        exportPct = percentile;

        const subjects = [
          { name: 'Internal Medicine', pct: (num(student.batenaScore) / 565) * 100 },
          { name: 'General Surgery', pct: (num(student.gerahaScore) / 565) * 100 },
          { name: 'Integrated Medicine', pct: (num(student.tekamlyScore) / 150) * 100 },
          { name: 'Dermatology', pct: (num(student.dermaTotal) / 75) * 100 },
          { name: 'Cardiopulmonary', pct: (num(student.cardioTotal) / 150) * 100 },
          { name: 'Neural Science', pct: (num(student.neuroTotal) / 100) * 100 },
          { name: 'Investigative Med', pct: (num(student.investigativeTotal) / 50) * 100 }
        ].filter(s => s.pct > 0);

        if (subjects.length > 0) {
          subjects.sort((a, b) => b.pct - a.pct);
          bestSubName = `${subjects[0].name} (${subjects[0].pct.toFixed(1)}%)`;
        }

        analyticsHTML = `
          <div class="target-result-card" style="border-color: rgba(6, 182, 212, 0.3); background: rgba(6, 182, 212, 0.05); margin-top:20px;">
            <div style="text-align:center;margin-bottom:12px">
              <span style="color:var(--accent2);font-size:15px;font-weight:700">📊 Performance Analytics</span>
            </div>
            <div class="diff-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
              <div class="diff-item">
                <div style="font-size:13px;color:var(--muted)">Class Standing</div>
                <div style="font-size:26px;font-weight:900;color:var(--gold);margin:5px 0;">Top ${exportPct}%</div>
                <div style="font-size:12px;color:var(--muted)">Higher than ${percentile}% of students</div>
              </div>
              <div class="diff-item">
                <div style="font-size:13px;color:var(--muted)">Best Performing Module</div>
                <div style="font-size:20px;font-weight:900;color:var(--green);margin:5px 0;">${bestSubName}</div>
                <div style="font-size:12px;color:var(--muted)">Highest score percentage</div>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="scoreChart"></canvas>
            </div>
          </div>`;

        setTimeout(() => {
          const ctx = document.getElementById('scoreChart');
          if (ctx) {
            new Chart(ctx, {
              type: 'bar',
              data: {
                labels: ['Medicine (565)', 'Surgery (565)', 'Integrated (150)', 'Derma (75)', 'Cardio (150)', 'Neuro (100)', 'Investigative (50)'],
                datasets: [
                  {
                    label: 'Score Percentage (%)',
                    data: [
                      ((num(student.batenaScore) / 565) * 100).toFixed(1),
                      ((num(student.gerahaScore) / 565) * 100).toFixed(1),
                      ((num(student.tekamlyScore) / 150) * 100).toFixed(1),
                      ((num(student.dermaTotal) / 75) * 100).toFixed(1),
                      ((num(student.cardioTotal) / 150) * 100).toFixed(1),
                      ((num(student.neuroTotal) / 100) * 100).toFixed(1),
                      ((num(student.investigativeTotal) / 50) * 100).toFixed(1)
                    ],
                    backgroundColor: 'rgba(6, 182, 212, 0.4)',
                    borderColor: '#06b6d4',
                    borderWidth: 2,
                    borderRadius: 6
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  y: {
                    min: 0,
                    max: 100,
                    grid: { color: 'rgba(255,255,255,0.05)' },
                    ticks: { color: '#94a3b8' }
                  },
                  x: {
                    grid: { display: false },
                    ticks: { color: '#94a3b8', font: { size: 11 } }
                  }
                },
                plugins: {
                  legend: {
                    display: true,
                    labels: { color: '#fff' }
                  }
                }
              }
            });
          }
        }, 100);
      }

      // Export Certificate Card
      const exportCardHTML = `
        <div class="export-card" style="width: 840px; padding: 40px; background: #0a0f1e; background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 45%), radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.15), transparent 45%); color: #fff; font-family: 'Inter', sans-serif; position: absolute; left: -9999px; top: -9999px; border-radius: 20px; border: 1px solid rgba(59, 130, 246, 0.35);">
          <div style="text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; margin-bottom: 30px;">
            <div style="font-size: 15px; color: #06b6d4; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;">Alexandria University · Faculty of Medicine</div>
            <div style="font-size: 32px; font-weight: 900; margin-top: 8px; color: #fff; margin-bottom: 0;">4th Year Official Final Results · Round 1</div>
          </div>
          
          <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 25px 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <div style="text-align: left;">
              <div style="color: #94a3b8; font-size: 16px; margin-bottom: 8px;">Seating No: <span style="color: #fff; font-weight: bold;">${student.id}</span> ${engAppreciation ? `<span style="margin-left:12px;color:#06b6d4;font-weight:700">| Grade: ${engAppreciation}</span>` : ''}</div>
              <div style="display: flex; gap: 10px;">
                <div style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05)); border: 1px solid rgba(245, 158, 11, 0.3); padding: 8px 16px; border-radius: 10px;">
                  <span style="color: #f59e0b; font-size: 12px; font-weight: bold; text-transform: uppercase;">Cumulative Rank:</span>
                  <span style="font-size: 22px; font-weight: 900; color: #f59e0b;">#${student.cumulativeRank || '—'}</span>
                </div>
                <div style="background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); padding: 8px 16px; border-radius: 10px;">
                  <span style="color: #06b6d4; font-size: 12px; font-weight: bold; text-transform: uppercase;">4th Year Rank:</span>
                  <span style="font-size: 22px; font-weight: 900; color: #06b6d4;">#${student.year4Rank || '—'}</span>
                </div>
              </div>
            </div>
            <div style="text-align: right; direction: rtl;">
              <div style="font-size: 28px; font-weight: 900; color: #fff; font-family: 'Cairo', sans-serif;">${student.name || '—'}</div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 25px;">
            <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); padding: 18px; border-radius: 14px; text-align: center;">
              <div style="color: #94a3b8; font-size: 13px; margin-bottom: 4px;">Old Cumulative Total</div>
              <div style="font-size: 26px; font-weight: 900; color: #fff;">${formatScore(student.oldTotal)}</div>
            </div>
            <div style="background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.3); padding: 18px; border-radius: 14px; text-align: center;">
              <div style="color: #94a3b8; font-size: 13px; margin-bottom: 4px;">4th Year Total</div>
              <div style="font-size: 26px; font-weight: 900; color: #3b82f6;">${formatScore(student.totalGrade)} <span style="font-size: 14px; color: #64748b;">/ 1655</span></div>
            </div>
            <div style="background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(59, 130, 246, 0.08)); border: 1px solid rgba(6, 182, 212, 0.3); padding: 18px; border-radius: 14px; text-align: center;">
              <div style="color: #94a3b8; font-size: 13px; margin-bottom: 4px;">Grand Cumulative</div>
              <div style="font-size: 26px; font-weight: 900; color: #06b6d4;">${formatScore(student.cumulativeTotal)}</div>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px 25px; border-radius: 12px; font-size: 14px;">
            <span>Best Module: <b style="color:#10b981;">${bestSubName}</b></span>
            <span>Percentile: <b style="color:#f59e0b;">Top ${exportPct}%</b></span>
            <span>Status: <b style="color:#10b981;">${passStatus}</b></span>
          </div>

          <div style="text-align: center; color: #64748b; font-size: 13px; margin-top: 20px; letter-spacing: 1px;">
            Verified Results • Generated via Medical Analytics Platform • Made by Mahmoud
          </div>
        </div>
      `;

      outputEl.innerHTML = `
        <div class="results-container">
          <div class="student-card">
            <div class="student-card-content">
              <div class="student-meta">
                <div class="badges">
                  <div class="badge">Seating No: <b>${student.id}</b></div>
                  ${engAppreciation ? `<div class="badge appreciation-badge">Overall Grade: <b>${engAppreciation}</b></div>` : ''}
                </div>
                <div class="rank-banners-group">
                  <div class="rank-banner">
                    🏆 Cumulative Rank: <span class="rank-num">#${student.cumulativeRank || '—'}</span>
                    ${student.oldRank ? `<span style="font-size:12px;opacity:0.8;margin-left:4px">(Prev: #${student.oldRank})</span>` : ''}
                    ${student.rankChange !== null && student.rankChange !== undefined ? `
                      <span class="rank-change-badge ${student.rankChange > 0 ? 'up' : (student.rankChange < 0 ? 'down' : 'same')}">
                        ${student.rankChange > 0 ? `▲ +${student.rankChange}` : (student.rankChange < 0 ? `▼ ${student.rankChange}` : `•`)}
                      </span>` : ''}
                  </div>
                  <div class="rank-banner sub-rank">
                    🏅 4th Year Rank: <span class="rank-num">#${student.year4Rank || '—'}</span>
                    <span style="font-size:12px;opacity:0.7">/ ${validY4Students.length}</span>
                  </div>
                </div>
              </div>
              <div class="student-name">${student.name || '—'}</div>
            </div>
          </div>

          <div class="summary-grid">
            <div class="summary-card">
              <div class="summary-label">Old Cumulative Total</div>
              <div class="summary-val">${formatScore(student.oldTotal)}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:4px">${student.oldRank ? `Previous Rank: #${student.oldRank}` : 'Baseline Total'}</div>
            </div>
            <div class="summary-card">
              <div class="summary-label">4th Year Total</div>
              <div class="summary-val" style="color:var(--accent);">${formatScore(student.totalGrade)} <span style="font-size:14px;color:var(--muted)">/ ${MAX_4TH}</span></div>
              <div style="font-size:12px;color:var(--accent2);margin-top:4px">${hasY4Total ? `${pctPct}% · Rank #${student.year4Rank || '—'}` : '—'}</div>
            </div>
            <div class="summary-card">
              <div class="summary-label">Grand Cumulative Total</div>
              <div class="summary-val highlight">${formatScore(student.cumulativeTotal)}</div>
              <div style="font-size:12px;color:var(--gold);margin-top:4px">${student.cumulativeRank ? `Cumulative Rank: #${student.cumulativeRank}` : '—'}</div>
            </div>
          </div>

          <div class="section-title">Major Modules (Batena & Geraha)</div>
          <div class="modules-grid">
            ${moduleCard('Internal Medicine', student.batenaScore, 565, student.batenaGrade, student.batenaRank)}
            ${moduleCard('General Surgery', student.gerahaScore, 565, student.gerahaGrade, student.gerahaRank)}
          </div>

          <div class="section-title">Integrated & Dermatology</div>
          <div class="modules-grid">
            ${moduleCard('Integrated Medicine', student.tekamlyScore, 150, student.tekamlyGrade, student.tekamlyRank)}
            ${moduleCard('Dermatology', student.dermaTotal, 75, student.dermaGrade, student.dermaRank)}
          </div>
          <div class="module-card" style="margin-top:10px">
            <div class="module-name" style="margin-bottom:8px">Dermatology Breakdown</div>
            ${subScoreRow('End of Block', student.dermaEndBlock, 20)}
            ${subScoreRow('Clinical Total', student.dermaClinical, 25)}
            ${subScoreRow('End of Semester (Final)', student.dermaEndSm, 30)}
          </div>

          <div class="section-title">Cardiopulmonary System</div>
          <div class="modules-grid">
            ${moduleCard('Cardiopulmonary Total', student.cardioTotal, 150, student.cardioGrade, student.cardioRank)}
          </div>
          <div class="module-card" style="margin-top:10px">
            <div class="module-name" style="margin-bottom:8px">Cardiopulmonary Breakdown</div>
            ${subScoreRow('End of Block', student.cardioEndBlock, 45)}
            ${subScoreRow('OSCE Cardio', student.cardioOsce, 20)}
            ${subScoreRow('Total OSCE Chest', student.chestOsce, 20)}
            ${subScoreRow('End of Semester', student.cardioEndSm, 65)}
          </div>

          <div class="section-title">Neural Science & Investigative Medicine</div>
          <div class="modules-grid">
            ${moduleCard('Neural Science', student.neuroTotal, 100, student.neuroGrade, student.neuroRank)}
            ${moduleCard('Investigative Medicine', student.investigativeTotal, 50, student.investigativeGrade, student.investigativeRank)}
          </div>
          <div class="modules-grid" style="margin-top:10px">
            <div class="module-card">
              <div class="module-name" style="margin-bottom:8px">Neural Science Breakdown</div>
              ${subScoreRow('Clinical', student.neuroClinical, 37)}
              ${subScoreRow('MCQ End of Semester', student.neuroMcq, 63)}
            </div>
            <div class="module-card">
              <div class="module-name" style="margin-bottom:8px">Investigative Medicine Breakdown</div>
              ${subScoreRow('Radio End Block', student.radioEndBlock, 10)}
              ${subScoreRow('Clinical Pathology', student.clinPath, 15)}
              ${subScoreRow('MCQ', student.investigativeMcq, 25)}
            </div>
          </div>

          <div class="total-section">
            <div>
              <div style="font-size:13px;color:var(--muted);margin-bottom:4px">4th Year Final Score (Out of 1655)</div>
              <div class="total-score">
                ${hasY4Total ? formatScore(y4Val) : (isAbsent ? 'Absent' : formatScore(student.totalGrade))}
                <span style="font-size:18px;color:var(--muted)"> / ${MAX_4TH}</span>
              </div>
            </div>
            ${hasY4Total ? `<div style="font-size:26px;font-weight:900;color:var(--accent2)">${pctPct}%</div>` : ''}
            <div class="status-pill ${passStatus === 'Fail' ? 'fail' : 'pass'}">
              ${passStatus === 'Fail' ? '✗ Fail' : (isAbsent ? 'Absent' : '✓ ' + passStatus)}
            </div>
          </div>

          ${targetHTML}
          ${analyticsHTML}
          ${exportCardHTML}

          <div style="text-align: center; margin-top: 30px; margin-bottom: 10px;">
            <button class="btn" onclick="shareResult(this)" style="background: linear-gradient(135deg, #10b981, #059669); max-width: 320px; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); font-size: 16px; padding: 12px 24px; border-radius: 50px;">📸 Download Result Card (Share)</button>
          </div>
        </div>`;
    }

    function shareResult(btn) {
      const container = btn.closest('.results-container');
      const exportCard = container.querySelector('.export-card');
      const originalText = btn.innerHTML;

      btn.innerHTML = '⏳ Generating Card...';
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';

      exportCard.style.left = '0';
      exportCard.style.top = '0';
      exportCard.style.zIndex = '-9999';

      setTimeout(() => {
        html2canvas(exportCard, {
          scale: 2,
          backgroundColor: '#0a0f1e',
          useCORS: true
        }).then(canvas => {
          exportCard.style.left = '-9999px';
          exportCard.style.top = '-9999px';

          btn.innerHTML = originalText;
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'auto';

          const link = document.createElement('a');
          link.download = 'Official_Result_Card_4th_Final.png';
          link.href = canvas.toDataURL('image/png', 1.0);
          link.click();
        }).catch(err => {
          console.error(err);
          exportCard.style.left = '-9999px';
          exportCard.style.top = '-9999px';
          btn.innerHTML = originalText;
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'auto';
          alert('Error generating image');
        });
      }, 100);
    }

    document.getElementById('studentId').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchStudent();
    });
    document.getElementById('targetRank').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchStudent();
    });
  </script>
</body>

</html>
