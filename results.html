<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج كلية الطب - الإسكندرية</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --gold: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(59, 130, 246, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
    }

    .main-content {
      flex: 1;
    }

    .header {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .header::after {
      content: '';
      display: block;
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin: 16px auto 0;
      border-radius: 2px;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 4px;
      color: var(--accent2);
      font-weight: 300;
      margin-bottom: 10px;
      font-family: 'Tajawal', sans-serif;
    }

    h1 {
      font-size: clamp(24px, 5vw, 44px);
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
      font-family: 'Tajawal', sans-serif;
    }

    .tabs-container {
      max-width: 480px;
      margin: 0 auto 24px;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      background: transparent;
      color: var(--muted);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    .tab-btn:not(.active):hover {
      background: var(--surface2);
      color: var(--text);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .search-container {
      max-width: 480px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-family: 'Tajawal', sans-serif;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      font-family: 'Cairo', sans-serif;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: #334155;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .target-box {
      background: rgba(245, 158, 11, 0.05);
      border: 1px dashed rgba(245, 158, 11, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .target-box input {
      margin-bottom: 0;
      font-size: 18px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .target-box label {
      color: var(--gold);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .results-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 40px;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .student-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .student-name {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #fff;
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .badge b {
      color: var(--accent2);
    }

    .rank-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--gold);
      font-weight: 700;
    }

    .rank-num {
      font-size: 26px;
      font-weight: 900;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      font-family: 'Tajawal', sans-serif;
      margin: 20px 0 14px;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .module-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .module-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    .score-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 8px;
    }

    .score-big {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
    }

    .score-of {
      font-size: 13px;
      color: var(--muted);
    }

    .total-section {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(6, 182, 212, 0.04));
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .total-score {
      font-size: 40px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .target-result-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(220, 38, 38, 0.05));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .target-result-card::before {
      content: '🎯 Am I Far?';
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 12px;
      font-weight: 900;
      color: rgba(245, 158, 11, 0.5);
      font-family: 'Tajawal', sans-serif;
    }

    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 15px;
    }

    .diff-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .diff-value {
      font-size: 28px;
      font-weight: 900;
      color: #ef4444;
      margin: 5px 0;
    }

    .target-value {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold);
    }

    .error-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #f87171;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
    }

    .pass {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .fail {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .footer-signature {
      text-align: center;
      padding: 30px 20px;
      margin-top: auto;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
    }

    .footer-signature a {
      text-decoration: underline;
      text-decoration-color: var(--accent2);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      transition: text-decoration-color 0.3s ease;
    }

    .footer-signature a:hover {
      text-decoration-color: var(--accent);
    }

    .footer-signature span {
      font-family: 'Cairo', sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0 4px;
    }

    @media (max-width: 600px) {
      .modules-grid {
        grid-template-columns: 1fr;
      }

      .diff-grid {
        grid-template-columns: 1fr;
      }
    }

    .analytics-dashboard {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .analytics-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent2);
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .charts-layout {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-wrapper {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      position: relative;
    }

    .analytics-grid {
      display: grid;
      gap: 16px;
      margin-bottom: 24px;
    }

    .analysis-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      transition: transform 0.3s, border-color 0.3s;
      position: relative;
      overflow: hidden;
    }

    .analysis-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.02);
    }

    .analysis-icon {
      font-size: 28px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .analysis-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-family: 'Tajawal', sans-serif;
    }

    .analysis-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    .analysis-highlight {
      color: var(--gold);
      font-size: 18px;
      font-weight: 900;
    }

    .analysis-good {
      color: #10b981;
    }

    .analysis-warn {
      color: #f59e0b;
    }

    .analysis-bad {
      color: #ef4444;
    }
  </style>
</head>

<body>

  <div class="main-content">
    <div class="header">
      <div class="logo">Alexandria University · Faculty of Medicine</div>
      <h1>نتائج كلية طب اسكندرية</h1>
    </div>
    <div id="panel-y1" class="tab-panel active">
      <div class="tabs-container">
        <div class="tabs" style="max-width:400px;margin:0 auto 20px">
          <button class="tab-btn active" id="subTabAm" onclick="switchSubTab('am')">🏫 العام</button>
          <button class="tab-btn" id="subTabIntl" onclick="switchSubTab('intl')" style="background:transparent">🌍
            الدولي</button>
          <button class="tab-btn" id="subTabAll" onclick="switchSubTab('all')" style="background:transparent">🏆
            الكل</button>
        </div>
      </div>

      <div id="subpanel-am">
        <div class="search-container">
          <div class="search-box" style="border-color: rgba(6,182,212,0.3);">
            <label style="color:var(--accent2)">رقم الجلوس (ID) - العام</label>
            <input type="number" id="studentId" placeholder="مثال: 42">
            <div class="target-box">
              <label>🎯 Am I Far? (اختياري)</label>
              <p style="font-size: 11px; color: var(--muted); margin-bottom: 10px;">أدخل الترتيب المستهدف لتعرف الفرق
                بينك وبينه (مثال: 1)</p>
              <input type="number" id="targetRank" placeholder="الترتيب المستهدف">
            </div>
            <button class="btn" onclick="searchStudent()">🔍 عرض نتيجة العام</button>
          </div>
        </div>
        <div id="output"></div>
      </div>

      <div id="subpanel-intl" style="display:none">
        <div class="search-container">
          <div class="search-box" style="border-color: rgba(6,182,212,0.3);">
            <label style="color:var(--accent2)">رقم الجلوس (ID) - الدولي</label>
            <input type="text" id="studentIdIntl" placeholder="مثال: 100-1-25"
              style="font-size:18px;letter-spacing:1px">
            <div class="target-box">
              <label>🎯 Am I Far? (اختياري)</label>
              <p style="font-size: 11px; color: var(--muted); margin-bottom: 10px;">أدخل الترتيب المستهدف</p>
              <input type="number" id="targetRankIntl" placeholder="الترتيب المستهدف">
            </div>
            <button class="btn" onclick="searchStudentIntl()">🔍 عرض نتيجة الدولي</button>
          </div>
        </div>
        <div id="outputIntl"></div>
      </div>

      <div id="subpanel-all" style="display:none">
        <div class="search-container">
          <div class="search-box" style="border-color: rgba(245,158,11,0.3);">
            <label style="color:var(--gold)">رقم الجلوس (ID) - الترتيب العام الشامل</label>
            <input type="text" id="studentIdAll" placeholder="مثال: 42 أو 100-1-25"
              style="font-size:18px;letter-spacing:1px">
            <div class="target-box">
              <label>🎯 Am I Far? (اختياري)</label>
              <p style="font-size: 11px; color: var(--muted); margin-bottom: 10px;">أدخل الترتيب المستهدف على مستوى
                الدفعة كاملة</p>
              <input type="number" id="targetRankAll" placeholder="الترتيب المستهدف">
            </div>
            <button class="btn" onclick="searchStudentAll()">🔍 عرض النتيجة الشاملة</button>
          </div>
        </div>
        <div id="outputAll"></div>
      </div>
    </div>
  </div>

  <div class="footer-signature">
    made by : <a href="https://t.me/behonor" target="_blank"><span>Mahmoud</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="data.js"></script>
  <script src="data_intl.js"></script>

  <script>
    function switchSubTab(sub) {
      document.getElementById('subTabAm').classList.toggle('active', sub === 'am');
      document.getElementById('subTabIntl').classList.toggle('active', sub === 'intl');
      document.getElementById('subTabAll').classList.toggle('active', sub === 'all');

      document.getElementById('subTabAm').style.background = sub === 'am' ? '' : 'transparent';
      document.getElementById('subTabIntl').style.background = sub === 'intl' ? '' : 'transparent';
      document.getElementById('subTabAll').style.background = sub === 'all' ? '' : 'transparent';

      document.getElementById('subpanel-am').style.display = sub === 'am' ? '' : 'none';
      document.getElementById('subpanel-intl').style.display = sub === 'intl' ? '' : 'none';
      document.getElementById('subpanel-all').style.display = sub === 'all' ? '' : 'none';
    }

    let allStudents = [];
    let validStudents = [];
    const MAX_TOTAL = 1120;

    function isNumeric(v) { return v && !isNaN(parseFloat(v)) && v !== 'غ' && v !== 'راسب'; }
    function num(v) { return isNumeric(v) ? parseFloat(v) : 0; }
    function pctStr(v) { return isNumeric(v) ? (parseFloat(v) * 100).toFixed(2) + '%' : v || '—'; }

    function calcModuleRanks(list, suffix = '') {
      const modules = [
        { key: 'foundation', rankKey: 'foundationRank' + suffix },
        { key: 'bloodTotal', rankKey: 'bloodRank' + suffix },
        { key: 'mskTotal', rankKey: 'mskRank' + suffix },
        { key: 'cardioTotal', rankKey: 'cardioRank' + suffix },
        { key: 'commTotal', rankKey: 'commRank' + suffix }
      ];
      modules.forEach(mod => {
        let validMod = list.filter(s => isNumeric(s[mod.key]));
        validMod.sort((a, b) => num(b[mod.key]) - num(a[mod.key]));
        let rank = 1;
        for (let i = 0; i < validMod.length; i++) {
          if (i > 0 && num(validMod[i][mod.key]) < num(validMod[i - 1][mod.key])) rank = i + 1;
          validMod[i][mod.rankKey] = rank;
        }
      });
    }

    window.onload = () => {
      if (typeof studentsData === 'undefined') {
        document.getElementById('output').innerHTML = '<div class="results-container"><div class="error-box">⚠️ يرجى التأكد من وجود ملف data.js في نفس المجلد.</div></div>';
      } else {
        allStudents = studentsData;
        validStudents = allStudents.filter(s => isNumeric(s.totalGrade));
        validStudents.sort((a, b) => num(b.totalGrade) - num(a.totalGrade));
        let rank = 1;
        for (let i = 0; i < validStudents.length; i++) {
          if (i > 0 && num(validStudents[i].totalGrade) < num(validStudents[i - 1].totalGrade)) rank = i + 1;
          validStudents[i].rank = rank;
        }
        calcModuleRanks(validStudents);
      }
    };

    function barColor(pct) {
      if (pct >= 0.85) return '#10b981';
      if (pct >= 0.65) return '#3b82f6';
      if (pct >= 0.50) return '#f59e0b';
      return '#ef4444';
    }

    function moduleCard(name, score, max, pctVal, rank) {
      const p = isNumeric(score) ? num(score) / max : 0;
      const pctDisplay = isNumeric(pctVal) ? (parseFloat(pctVal) * 100).toFixed(1) + '%' : (score || '—');
      const rankHtml = rank ? `<div style="position:absolute;top:15px;left:15px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700" title="الترتيب في هذه المادة">🏆 #${rank}</div>` : '';
      return `<div class="module-card" style="position:relative">
        ${rankHtml}
        <div class="module-name" style="${rank ? 'padding-left: 50px;' : ''}">${name}</div>
        <div class="score-row">
          <span class="score-big" style="color:${barColor(p)}">${score || '—'}</span>
          <span class="score-of">/ ${max}</span>
        </div>
        <div style="margin-top:8px;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${(p * 100).toFixed(1)}%;background:${barColor(p)};border-radius:2px;transition:width 0.5s"></div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${pctDisplay}</div>
      </div>`;
    }

    function subScoreRow(label, val, max) {
      const p = isNumeric(val) ? num(val) / max : 0;
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px">
        <span style="color:var(--muted)">${label}</span>
        <span style="font-weight:700;color:${barColor(p)}">${val || '—'} <span style="color:var(--muted);font-weight:400">/ ${max}</span></span>
      </div>`;
    }

    function searchStudent() {
      if (allStudents.length === 0) return;
      const idInput = parseInt(document.getElementById('studentId').value);
      const targetInput = parseInt(document.getElementById('targetRank').value);
      const output = document.getElementById('output');

      if (!idInput) {
        output.innerHTML = '<div class="results-container"><div class="error-box">⚠️ من فضلك أدخل رقم الجلوس</div></div>';
        return;
      }
      const student = allStudents.find(s => s.id === idInput);
      if (!student) {
        output.innerHTML = '<div class="results-container"><div class="error-box">❌ رقم الجلوس غير موجود!</div></div>';
        return;
      }
      renderY1Result(student, validStudents, allStudents.length, targetInput, output, 'rank');
    }

    let allStudentsIntl = [];
    let validStudentsIntl = [];

    let allStudentsCombined = [];
    let validStudentsCombined = [];

    function initIntl() {
      if (typeof studentsDataIntl !== 'undefined') {
        allStudentsIntl = studentsDataIntl;
        validStudentsIntl = allStudentsIntl.filter(s => isNumeric(s.totalGrade));
        validStudentsIntl.sort((a, b) => num(b.totalGrade) - num(a.totalGrade));
        let rank = 1;
        for (let i = 0; i < validStudentsIntl.length; i++) {
          if (i > 0 && num(validStudentsIntl[i].totalGrade) < num(validStudentsIntl[i - 1].totalGrade)) rank = i + 1;
          validStudentsIntl[i].rank = rank;
        }
        calcModuleRanks(validStudentsIntl);
      }

      if (typeof studentsData !== 'undefined' && typeof studentsDataIntl !== 'undefined') {
        allStudentsCombined = [...studentsData, ...studentsDataIntl];
        validStudentsCombined = allStudentsCombined.filter(s => isNumeric(s.totalGrade));
        validStudentsCombined.sort((a, b) => num(b.totalGrade) - num(a.totalGrade));
        let cRank = 1;
        for (let i = 0; i < validStudentsCombined.length; i++) {
          if (i > 0 && num(validStudentsCombined[i].totalGrade) < num(validStudentsCombined[i - 1].totalGrade)) cRank = i + 1;
          validStudentsCombined[i].combinedRank = cRank;
        }
        calcModuleRanks(validStudentsCombined, 'Combined');
      }
    }

    function renderY1Result(student, validList, totalCount, targetInput, outputEl, rankKey = 'rank', suffix = '') {
      const hasTotal = isNumeric(student.totalGrade);
      const isAbsent = student.totalGrade === 'غ';
      const isFail = student.totalGrade === 'راسب';
      const totalVal = hasTotal ? num(student.totalGrade) : 0;
      const pctPct = hasTotal ? (num(student.totalPercentage) * 100).toFixed(2) : '—';
      const passStatus = isFail ? 'راسب' : (isAbsent ? 'غائب' : (hasTotal ? 'ناجح' : '—'));
      const studentRank = student[rankKey] || '—';

      let targetHTML = '';
      if (targetInput && hasTotal && studentRank !== '—') {
        let ts = validList.find(s => s[rankKey] === targetInput);
        if (!ts) ts = validList.find(s => s[rankKey] >= targetInput);
        if (studentRank <= targetInput) {
          targetHTML = `<div class="target-result-card" style="border-color:#10b981; background: rgba(16, 185, 129, 0.05);"><h3 style="color:#10b981; text-align:center;">🎉 أنت بالفعل في هذا الترتيب أو أعلى!</h3></div>`;
        } else if (ts) {
          const tTotal = num(ts.totalGrade);
          const diffScore = (tTotal - totalVal).toFixed(2);
          const targetPct = (num(ts.totalPercentage) * 100).toFixed(2);
          targetHTML = `
            <div class="target-result-card">
              <div style="text-align:center;margin-bottom:10px"><span style="color:var(--muted);font-size:14px">بيانات المركز رقم ${ts[rankKey]}</span></div>
              <div class="diff-grid">
                <div class="diff-item"><div style="font-size:13px;color:var(--muted)">مجموع الترتيب المستهدف</div><div class="target-value">${tTotal} <span style="font-size:14px;color:var(--muted)">/ ${MAX_TOTAL}</span></div><div style="font-size:14px;color:var(--gold)">${targetPct}%</div></div>
                <div class="diff-item"><div style="font-size:13px;color:var(--muted)">الفرق بينكم (اللي ناقصك)</div><div class="diff-value">🔻 ${diffScore} <span style="font-size:16px">درجة</span></div></div>
              </div>
            </div>`;
        }
      }

      let analyticsHTML = '';
      if (hasTotal) {
        const totalValid = validList.length;
        const percentile = ((totalValid - studentRank) / totalValid * 100).toFixed(1);

        const subjects = [
          { name: 'Foundation', pct: parseFloat(student.foundationPct) || 0 },
          { name: 'Blood', pct: parseFloat(student.bloodPct) || 0 },
          { name: 'MSK', pct: parseFloat(student.mskPct) || 0 },
          { name: 'Cardio', pct: parseFloat(student.cardioPct) || 0 },
          { name: 'Communication', pct: parseFloat(student.commPct) || 0 }
        ].filter(s => s.pct > 0);

        let bestSubject = { name: '—', pct: 0 }, worstSubject = { name: '—', pct: 100 };
        if (subjects.length > 0) {
          bestSubject = subjects.reduce((a, b) => a.pct > b.pct ? a : b);
          worstSubject = subjects.reduce((a, b) => a.pct < b.pct ? a : b);
        }

        const score = totalVal;
        const max = MAX_TOTAL;
        const pctScore = score / max;
        let nextTierDist = '—', nextTierName = '—';
        if (pctScore < 0.65) { nextTierDist = Math.ceil(max * 0.65 - score); nextTierName = 'جيد (65%)'; }
        else if (pctScore < 0.75) { nextTierDist = Math.ceil(max * 0.75 - score); nextTierName = 'جيد جداً (75%)'; }
        else if (pctScore < 0.85) { nextTierDist = Math.ceil(max * 0.85 - score); nextTierName = 'امتياز (85%)'; }
        else { nextTierDist = '0'; nextTierName = 'أنت في أعلى تصنيف!'; }

        let sum = 0, sumF = 0, sumB = 0, sumM = 0, sumC = 0, sumComm = 0;
        let cF = 0, cB = 0, cM = 0, cC = 0, cComm = 0;
        for (let s of validList) {
          sum += num(s.totalGrade);
          if (parseFloat(s.foundationPct)) { sumF += parseFloat(s.foundationPct); cF++; }
          if (parseFloat(s.bloodPct)) { sumB += parseFloat(s.bloodPct); cB++; }
          if (parseFloat(s.mskPct)) { sumM += parseFloat(s.mskPct); cM++; }
          if (parseFloat(s.cardioPct)) { sumC += parseFloat(s.cardioPct); cC++; }
          if (parseFloat(s.commPct)) { sumComm += parseFloat(s.commPct); cComm++; }
        }

        const avgScore = sum / validList.length;
        const diffFromAvg = (score - avgScore).toFixed(1);
        const avgText = diffFromAvg >= 0
          ? `<span class="analysis-good">أنت أعلى بـ ${diffFromAvg} درجة</span>`
          : `<span class="analysis-bad">أنت أقل بـ ${Math.abs(diffFromAvg)} درجة</span>`;

        const avgF = cF ? (sumF / cF) * 100 : 0;
        const avgB = cB ? (sumB / cB) * 100 : 0;
        const avgM = cM ? (sumM / cM) * 100 : 0;
        const avgC = cC ? (sumC / cC) * 100 : 0;
        const avgComm = cComm ? (sumComm / cComm) * 100 : 0;

        const radarId = 'radar-' + student.id + '-' + Math.random().toString(36).substr(2, 9);
        const barId = 'bar-' + student.id + '-' + Math.random().toString(36).substr(2, 9);

        analyticsHTML = `
          <div class="analytics-dashboard">
            <div class="analytics-title">📊 Analysis</div>
            
            <div class="charts-layout">
              <div class="chart-wrapper">
                <div style="font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:700;text-align:center">مقارنة بمتوسط الدفعة </div>
                <div style="position: relative; height: 260px; width: 100%;">
                  <canvas id="${barId}"></canvas>
                </div>
              </div>
              <div class="chart-wrapper">
                <div style="font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:700;text-align:center">التحليل</div>
                <div style="position: relative; height: 260px; width: 100%;">
                  <canvas id="${radarId}"></canvas>
                </div>
              </div>
            </div>

            <div class="analytics-grid" style="grid-template-columns: 1fr 1fr;">
              <div class="analysis-card">
                <div class="analysis-icon">📈</div>
                <div class="analysis-label">الترتيب المئوي</div>
                <div class="analysis-val">أنت تتفوق على <br><span class="analysis-highlight">${percentile}%</span> من الدفعة</div>
              </div>
              <div class="analysis-card">
                <div class="analysis-icon">⭐</div>
                <div class="analysis-label">نقطة القوة (أفضل مادة)</div>
                <div class="analysis-val analysis-good">${bestSubject.name} <br><span style="font-size:14px">(${(bestSubject.pct * 100).toFixed(1)}%)</span></div>
              </div>
              <div class="analysis-card">
                <div class="analysis-icon">🎯</div>
                <div class="analysis-label">الهدف القادم</div>
                <div class="analysis-val">${nextTierDist === '0' ? '<span class="analysis-good">أنت في الامتياز!</span>' : `أنت محتاج <span class="analysis-warn">${nextTierDist} درجة</span> للوصول لـ ${nextTierName}`}</div>
              </div>
              <div class="analysis-card">
                <div class="analysis-icon">⚖️</div>
                <div class="analysis-label">متوسط الدفعة الشامل</div>
                <div class="analysis-val">${avgText}</div>
              </div>
            </div>
          </div>
        `;

        setTimeout(() => {
          const studentDataPoints = [
            (parseFloat(student.foundationPct) || 0) * 100,
            (parseFloat(student.bloodPct) || 0) * 100,
            (parseFloat(student.mskPct) || 0) * 100,
            (parseFloat(student.cardioPct) || 0) * 100,
            (parseFloat(student.commPct) || 0) * 100
          ];
          const labelsArr = ['Foundation', 'Blood', 'MSK', 'Cardio', 'Comm'];

          const ctxRadar = document.getElementById(radarId);
          if (ctxRadar) {
            new Chart(ctxRadar, {
              type: 'radar',
              data: {
                labels: labelsArr,
                datasets: [{
                  label: 'مستواك',
                  data: studentDataPoints,
                  backgroundColor: 'rgba(59, 130, 246, 0.2)',
                  borderColor: 'rgba(59, 130, 246, 1)',
                  pointBackgroundColor: '#06b6d4',
                  pointBorderColor: '#fff',
                  borderWidth: 2,
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  r: {
                    min: 0,
                    max: 100,
                    ticks: { display: false, stepSize: 20 },
                    grid: { color: 'rgba(255,255,255,0.1)' },
                    angleLines: { color: 'rgba(255,255,255,0.1)' },
                    pointLabels: { color: '#94a3b8', font: { family: 'Cairo', size: 10, weight: 'bold' } }
                  }
                },
                plugins: { legend: { display: false } }
              }
            });
          }

          const ctxBar = document.getElementById(barId);
          if (ctxBar) {
            new Chart(ctxBar, {
              type: 'bar',
              data: {
                labels: labelsArr,
                datasets: [
                  {
                    label: 'نسبتك (%)',
                    data: studentDataPoints,
                    backgroundColor: 'rgba(16, 185, 129, 0.8)',
                    borderRadius: 4
                  },
                  {
                    label: 'متوسط الدفعة (%)',
                    data: [avgF, avgB, avgM, avgC, avgComm],
                    backgroundColor: 'rgba(245, 158, 11, 0.8)',
                    borderRadius: 4
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  y: {
                    min: 0,
                    max: 100,
                    grid: { color: 'rgba(255,255,255,0.05)' },
                    ticks: { color: '#94a3b8' }
                  },
                  x: {
                    grid: { display: false },
                    ticks: { color: '#94a3b8', font: { size: 10 } }
                  }
                },
                plugins: {
                  legend: {
                    display: true,
                    labels: { color: '#fff', font: { family: 'Tajawal' } }
                  }
                }
              }
            });
          }
        }, 100);
      }

      outputEl.innerHTML = `
        <div class="results-container">
          <div class="student-card">
            <div class="student-name">${student.name || '—'}</div>
            <div class="badges"><div class="badge">رقم الجلوس: <b>${student.id}</b></div></div>
            <div class="rank-banner">🏆 الترتيب على الدفعة: <span class="rank-num">${studentRank}</span> <span style="font-size:13px;opacity:0.6">/ ${totalCount}</span></div>
          </div>
          <div class="section-title">First term & Communication , Skill Lab </div>
          <div class="modules-grid">
            ${moduleCard('Foundation of Medical School', student.foundation, 300, student.foundationPct, student['foundationRank' + suffix])}
            ${moduleCard('Blood & Immune System', student.bloodTotal, 180, student.bloodPct, student['bloodRank' + suffix])}
            ${moduleCard('Communication & Skill Lab', student.commTotal, 50, student.commPct, student['commRank' + suffix])}
          </div>
          <div class="section-title">Musculoskeletal System</div>
          <div class="modules-grid">${moduleCard('MSK Total', student.mskTotal, 250, student.mskPct, student['mskRank' + suffix])}</div>
          <div class="module-card" style="margin-top:10px"><div class="module-name" style="margin-bottom:8px">MSK Breakdown</div>
            ${subScoreRow('End of Module', student.mskEndModule, 50)}
            ${subScoreRow('End of Semester (Final)', student.mskEndSemester, 100)}
            ${subScoreRow('Practical', student.mskPractical, 75)}
          </div>
          <div class="section-title">Cardiopulmonary System</div>
          <div class="modules-grid">${moduleCard('Cardiopulmonary Total', student.cardioTotal, 300, student.cardioPct, student['cardioRank' + suffix])}</div>
          <div class="module-card" style="margin-top:10px"><div class="module-name" style="margin-bottom:8px">Cardiopulmonary Breakdown</div>
            ${subScoreRow('End of Module', student.cardioEndModule, 60)}
            ${subScoreRow('End of Semester (Final)', student.cardioEndSemester, 120)}
            ${subScoreRow('Practical', student.cardioPractical, 90)}
          </div>
          <div class="total-section">
            <div><div style="font-size:13px;color:var(--muted);margin-bottom:4px">إجمالي الدرجات</div>
              <div class="total-score">${hasTotal ? totalVal : (isAbsent ? 'غائب' : student.totalGrade)}<span style="font-size:18px;color:var(--muted)"> / ${MAX_TOTAL}</span></div></div>
            ${hasTotal ? `<div style="font-size:26px;font-weight:900;color:var(--accent2)">${pctPct}%</div>` : ''}
            <div class="status-pill ${passStatus === 'ناجح' ? 'pass' : 'fail'}">${passStatus === 'ناجح' ? '✓ ناجح' : (isAbsent ? 'غائب' : '✗ راسب')}</div>
          </div>
          ${targetHTML}
          ${analyticsHTML}
        </div>`;
    }

    function searchStudentIntl() {
      if (allStudentsIntl.length === 0) return;
      const idInput = document.getElementById('studentIdIntl').value.trim();
      const targetInput = parseInt(document.getElementById('targetRankIntl').value);
      const output = document.getElementById('outputIntl');
      if (!idInput) { output.innerHTML = '<div class="results-container"><div class="error-box">⚠️ من فضلك أدخل رقم الجلوس</div></div>'; return; }
      const student = allStudentsIntl.find(s => s.id === idInput);
      if (!student) { output.innerHTML = '<div class="results-container"><div class="error-box">❌ رقم الجلوس غير موجود!</div></div>'; return; }
      renderY1Result(student, validStudentsIntl, allStudentsIntl.length, targetInput, output, 'rank');
    }

    function searchStudentAll() {
      if (allStudentsCombined.length === 0) return;
      const idInput = document.getElementById('studentIdAll').value.trim();
      const targetInput = parseInt(document.getElementById('targetRankAll').value);
      const output = document.getElementById('outputAll');
      if (!idInput) { output.innerHTML = '<div class="results-container"><div class="error-box">⚠️ من فضلك أدخل رقم الجلوس</div></div>'; return; }

      const parsedId = /^\d+$/.test(idInput) ? parseInt(idInput) : idInput;
      const student = allStudentsCombined.find(s => s.id === parsedId);

      if (!student) { output.innerHTML = '<div class="results-container"><div class="error-box">❌ رقم الجلوس غير موجود!</div></div>'; return; }
      renderY1Result(student, validStudentsCombined, allStudentsCombined.length, targetInput, output, 'combinedRank', 'Combined');
    }

    const origOnload = window.onload;
    window.onload = () => { origOnload(); initIntl(); };

    document.getElementById('studentId').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudent(); });
    document.getElementById('targetRank').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudent(); });
    document.getElementById('studentIdIntl').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudentIntl(); });
    document.getElementById('targetRankIntl').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudentIntl(); });
    document.getElementById('studentIdAll').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudentAll(); });
    document.getElementById('targetRankAll').addEventListener('keydown', e => { if (e.key === 'Enter') searchStudentAll(); });
  </script>
</body>

</html>
